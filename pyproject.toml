[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-autoscaler"
version = "0.1.0"
description = "RL autoscaler that learns to scale before traffic spikes, compared against threshold autoscaling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]
data = ["pandas>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
